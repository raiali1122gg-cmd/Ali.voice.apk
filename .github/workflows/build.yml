name: Build Ali Voice APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Create Project
        run: |
          mkdir -p app/src/main/java/com/ali/voice
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.ali.voice'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ali.voice"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
          }
          dependencies {
              implementation 'io.agora.rtc:full-sdk:4.2.6'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <application android:label="Ali Voice">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:gravity="center"
              android:background="#111111" android:padding="24dp">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="Ali Voice" android:textSize="30sp" android:textColor="#FFFFFF"/>
              <Button android:id="@+id/btnJoin" android:layout_width="match_parent"
                  android:layout_height="60dp" android:text="JOIN ROOM" android:layout_marginTop="30dp"/>
              <TextView android:id="@+id/tvStatus" android:layout_width="wrap_content"
                  android:layout_height="wrap_content" android:text="Ready..." android:textColor="#AAAAAA" android:layout_marginTop="20dp"/>
          </LinearLayout>
          EOF
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">Ali Voice</string></resources>
          EOF
          cat > app/src/main/java/com/ali/voice/MainActivity.java << 'EOF'
          package com.ali.voice;
          import android.Manifest; import android.app.Activity; import android.content.pm.PackageManager; import android.os.Bundle;
          import android.widget.Button; import android.widget.TextView; import android.widget.Toast;
          import io.agora.rtc2.*;
          public class MainActivity extends Activity {
              private final String appId = "902758061cd343b39a59cc7f887474b2";
              private final String channelName = "ali-voice-room";
              private RtcEngine mRtcEngine; private TextView tvStatus;
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState); setContentView(R.layout.activity_main);
                  tvStatus = findViewById(R.id.tvStatus); Button btnJoin = findViewById(R.id.btnJoin);
                  if(checkSelfPermission(Manifest.permission.RECORD_AUDIO)!=PackageManager.PERMISSION_GRANTED){
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 1);
                  }
                  btnJoin.setOnClickListener(v -> joinChannel());
              }
              void joinChannel(){
                  try{
                      RtcEngineConfig config = new RtcEngineConfig();
                      config.mContext = this; config.mAppId = appId;
                      config.mEventHandler = new IRtcEngineEventHandler(){
                          public void onJoinChannelSuccess(String c, int uid, int e){ runOnUiThread(() -> tvStatus.setText("Joined: "+c)); }
                          public void onUserJoined(int uid, int e){ runOnUiThread(() -> { tvStatus.setText("User: "+uid); Toast.makeText(MainActivity.this, "User joined", 0).show(); }); }
                      };
                      mRtcEngine = RtcEngine.create(config);
                      mRtcEngine.enableAudio();
                      ChannelMediaOptions opt = new ChannelMediaOptions();
                      opt.clientRoleType = Constants.CLIENT_ROLE_BROADCASTER;
                      opt.channelProfile = Constants.CHANNEL_PROFILE_LIVE_BROADCASTING;
                      mRtcEngine.joinChannel("", channelName, 0, opt);
                      tvStatus.setText("Connecting...");
                  } catch(Exception e){ tvStatus.setText("Error: "+e.getMessage()); }
              }
          }
          EOF
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          curl -sL -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          printf '#!/usr/bin/env sh\nexec java -jar gradle/wrapper/gradle-wrapper.jar "$@"\n' > gradlew
          chmod +x gradlew
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AliVoice-Fixed
          path: app/build/outputs/apk/debug/app-debug.apk
